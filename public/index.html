<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blogkep</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d0d0d">
<link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>

<header class="site-header">
  <div class="menu-wrap">
    <button class="menu-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
    <div class="side-menu" id="sideMenu">
      <a href="/" class="side-menu-link">&#127968; Beranda</a>
      <a href="/admin.html" class="side-menu-link">&#128100; Login</a>
      <div class="side-menu-divider"></div>
      <div class="side-menu-label">Kategori</div>
      <div id="sideMenuCategories"></div>
    </div>
  </div>

  <a href="/" class="brand-big">
    <img src="/logo-blogkep.png" alt="Blogkep" class="brand-logo-img">
  </a>

  <div class="header-icons">
    <button class="icon-btn notif-btn" aria-label="Notifikasi">&#128276;<span class="notif-badge">3</span></button>
    <a href="/admin.html" class="icon-btn" aria-label="Akun">&#128100;</a>
  </div>
</header>

<p class="site-tagline">Nonton Film, Series &amp; Drama Gratis</p>

<form class="search-box" id="searchForm">
  <span class="search-icon">&#128269;</span>
  <input type="text" id="searchInput" placeholder="Cari film, series, atau judul...">
  <button type="submit" class="search-submit-btn">&#128269; Search</button>
</form>

<nav class="category-rail" id="categoryRail">
  <div class="cat-pill active" data-id="">&#127968; Beranda</div>
</nav>

<div id="content"></div>

<p id="bannerText" class="banner-text-standalone" style="display:none"></p>

<a href="#" id="bannerImageLink" class="banner-image-strip" style="display:none" target="_blank" rel="noopener">
  <img id="bannerImage" src="" alt="Iklan">
</a>

<footer class="site-footer">
  <div class="social-icons">
    <a href="#" class="social-icon" aria-label="Telegram">&#9992;</a>
    <a href="#" class="social-icon" aria-label="Facebook">&#128246;</a>
  </div>
  <p class="footer-copy">Blogkep &copy; 2026. All rights reserved.</p>
</footer>

<script src="/app.js"></script>
<script src="/menu.js"></script>
</body>
  </html>
