<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - HDR Film</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="site-header">
  <a href="/" class="brand">HDR FILM</a>
  <div class="header-spacer"></div>
  <span id="whoami" class="chip" style="display:none"></span>
</header>

<!-- Form setup admin pertama kali -->
<div class="form-card" id="setupCard" style="display:none">
  <h1>Bikin Akun Admin</h1>
  <p class="video-meta">Belum ada admin. Isi token setup (dari environment variable <code>SETUP_TOKEN</code>) untuk membuat akun pertama.</p>
  <form id="setupForm">
    <div class="field"><label>Setup token</label><input type="password" id="setupToken" required></div>
    <div class="field"><label>Username</label><input type="text" id="setupUsername" required></div>
    <div class="field"><label>Password (min. 8 karakter)</label><input type="password" id="setupPassword" required minlength="8"></div>
    <button class="btn" type="submit">Buat Admin</button>
    <div class="msg" id="setupMsg"></div>
  </form>
</div>

<!-- Form login -->
<div class="form-card" id="loginCard" style="display:none">
  <h1>Login Admin</h1>
  <form id="loginForm">
    <div class="field"><label>Username</label><input type="text" id="loginUsername" required></div>
    <div class="field"><label>Password</label><input type="password" id="loginPassword" required></div>
    <button class="btn" type="submit">Masuk</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</div>

<!-- Dashboard admin -->
<div class="admin-shell" id="dashboard" style="display:none">

  <div class="panel">
    <h2>Kategori</h2>
    <div class="row-flex">
      <div class="field"><input type="text" id="newCategoryName" placeholder="Nama kategori baru, mis. Action"></div>
      <button class="btn" id="addCategoryBtn">Tambah</button>
    </div>
    <div class="admin-list" id="categoryList" style="margin-top:14px"></div>
  </div>

  <div class="panel">
    <h2 id="formHeading">Upload Video Baru</h2>
    <form id="videoForm">
      <input type="hidden" id="videoId">
      <div class="field"><label>Judul film</label><input type="text" id="videoTitle" required></div>
      <div class="field"><label>URL poster (link gambar)</label><input type="url" id="videoPoster" required></div>
      <div class="field"><label>Link embed Doodstream</label><input type="url" id="videoEmbed" required placeholder="https://dood.../e/xxxxx"></div>
      <div class="field">
        <label>Kategori</label>
        <select id="videoCategory"><option value="">- Tanpa kategori -</option></select>
      </div>
      <button class="btn" type="submit" id="videoSubmitBtn">Publikasikan</button>
      <button class="btn btn-ghost" type="button" id="cancelEditBtn" style="display:none">Batal edit</button>
      <div class="msg" id="videoMsg"></div>
    </form>
  </div>

  <div class="panel">
    <h2>Semua Video</h2>
    <div class="admin-list" id="videoList"></div>
  </div>

</div>

<script src="/admin.js"></script>
</body>
</html>
