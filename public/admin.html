<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - HDR Film</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="admin-header">
  <div class="admin-logo">
    <div class="admin-logo-top">HDR<span class="play-icon">&#9654;</span></div>
    <div class="admin-logo-bottom">&ndash; FILM &ndash;</div>
  </div>
  <div class="menu-wrap">
    <button class="menu-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
    <div class="side-menu" id="sideMenu">
      <a href="#" class="side-menu-link" data-view="upload">&#127968; Home</a>
      <a href="#" class="side-menu-link" data-view="myVideo">&#9654; My Vidio</a>
      <a href="#" class="side-menu-link" data-view="editBanner">&#9998; Edit Baner</a>
    </div>
  </div>
  <span id="whoami" class="chip" style="display:none"></span>
</header>

<!-- Form setup admin pertama kali -->
<div class="form-card" id="setupCard" style="display:none">
  <h1>Bikin Akun Admin</h1>
  <p class="video-meta">Belum ada admin. Isi token setup (dari environment variable <code>SETUP_TOKEN</code>) untuk membuat akun pertama.</p>
  <form id="setupForm">
    <div class="field"><label>Setup token</label><input type="password" id="setupToken" required></div>
    <div class="field"><label>Username</label><input type="text" id="setupUsername" required></div>
    <div class="field"><label>Password (min. 8 karakter)</label><input type="password" id="setupPassword" required minlength="8"></div>
    <button class="btn" type="submit">Buat Admin</button>
    <div class="msg" id="setupMsg"></div>
  </form>
</div>

<!-- Form login -->
<div class="form-card" id="loginCard" style="display:none">
  <h1>Login Admin</h1>
  <form id="loginForm">
    <div class="field"><label>Username</label><input type="text" id="loginUsername" required></div>
    <div class="field"><label>Password</label><input type="password" id="loginPassword" required></div>
    <button class="btn" type="submit">Masuk</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</div>

<!-- Dashboard admin -->
<div class="admin-shell" id="dashboard" style="display:none">

  <!-- View: Upload Film (default / Home) -->
  <div class="admin-view" id="viewUpload">
    <h1 class="admin-title">Upload Film</h1>
    <form id="videoForm">
      <input type="hidden" id="videoId">
      <input type="hidden" id="videoCategory">

      <div class="field">
        <label>Tambah Judul</label>
        <input type="text" id="videoTitle" required placeholder="Masukkan judul film disini...">
      </div>

      <div class="field">
        <label>Pilih Poster dari Galeri</label>
        <input type="file" id="posterFile" accept="image/*" style="display:none">
        <button type="button" class="btn btn-outline-block" id="posterUploadBtn">&#128247;&nbsp; Pilih dari Galeri</button>
        <div class="msg" id="posterUploadMsg"></div>
      </div>

      <div class="field">
        <label>Link Poster</label>
        <input type="url" id="videoPoster" required placeholder="Link poster akan muncul otomatis setelah dipilih">
      </div>

      <div class="field">
        <label>Link Embed Doodstream</label>
        <input type="url" id="videoEmbed" required placeholder="Masukkan link embed doodstream disini...">
      </div>

      <div class="category-field">
        <button type="button" class="btn-category" id="categoryBtn">&#9638;&nbsp; <span id="categoryBtnLabel">PILIH KATEGORI</span></button>
        <div class="category-popup" id="categoryPopup" style="display:none">
          <div class="category-popup-item new-cat">
            <span class="cat-icon">&#9998;</span>
            <input type="text" id="newCategoryName" placeholder="KATEGORI BARU">
          </div>
          <div id="categoryPopupList"></div>
          <div class="category-popup-item no-cat" data-id="" data-name="">TANPA KATEGORI</div>
        </div>
      </div>

      <button class="btn btn-block" type="submit" id="videoSubmitBtn">UNGGAH</button>
      <button class="btn btn-ghost btn-block" type="button" id="cancelEditBtn" style="display:none">Batal edit</button>
      <div class="msg" id="videoMsg"></div>
    </form>
  </div>

  <!-- View: My Vidio -->
  <div class="admin-view" id="viewMyVideo" style="display:none">
    <h1 class="admin-title">My Vidio</h1>
    <div class="admin-list" id="videoList"></div>
  </div>

  <!-- View: Edit Baner -->
  <div class="admin-view" id="viewEditBanner" style="display:none">
    <h1 class="admin-title">Edit Baner</h1>
    <form id="bannerForm">
      <div class="field">
        <label>Tampilkan Banner</label>
        <select id="bannerEnabled">
          <option value="true">Aktif</option>
          <option value="false">Nonaktif</option>
        </select>
      </div>
      <div class="field">
        <label>Teks Banner</label>
        <input type="text" id="bannerText" placeholder="Kumpulan vidio viral terbaru terupdate gratis ada disini">
      </div>
      <div class="field">
        <label>Link Tujuan (saat banner diklik)</label>
        <input type="url" id="bannerLink" placeholder="https://...">
      </div>
      <button class="btn btn-block" type="submit">Simpan Banner</button>
      <div class="msg" id="bannerMsg"></div>
    </form>
  </div>

</div>

<script src="/admin.js"></script>
</body>
            </html>
